[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-vlm"
version = "0.1.0"
description = "Material and condition recognition from images using a vision-language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.49",
    "accelerate",
    "pillow",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
material-vlm = "material_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
