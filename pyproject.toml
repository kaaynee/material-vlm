[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-vlm"
version = "0.1.0"
description = "Material and condition recognition from images using a vision-language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.56",
    "accelerate",
    "numpy",
    "pillow>=10.1",
    "opencv-python-headless",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# Fast kernels for Qwen3.5's linear-attention layers (CUDA only). Without them
# transformers falls back to a much slower PyTorch implementation.
qwen35 = ["flash-linear-attention"]

[project.scripts]
material-vlm = "material_vlm.cli:main"
material-vlm-frames = "material_vlm.frames:main"
material-vlm-compare = "material_vlm.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
